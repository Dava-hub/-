<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Конструктор товаров с выбором фото</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 30px auto;
      padding: 0 15px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }
    input, textarea, select {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #4caf50;
      border: none;
      color: white;
      border-radius: 4px;
    }
    .preview {
      margin-top: 15px;
      text-align: center;
    }
    .preview img {
      max-width: 100%;
      max-height: 250px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h1>Добавить новый товар</h1>

  <div class="form-group">
    <label for="title">Название товара</label>
    <input type="text" id="title" />
  </div>

  <div class="form-group">
    <label for="price">Цена (сом)</label>
    <input type="number" id="price" />
  </div>

  <div class="form-group">
    <label for="size">Размер товара</label>
    <input type="text" id="size" placeholder="Например: M, L, XL или 42x30 см" />
  </div>

  <div class="form-group">
    <label for="description">Описание</label>
    <textarea id="description" rows="3"></textarea>
  </div>

  <div class="form-group">
    <label for="imageSelect">Выбери фото товара</label>
    <select id="imageSelect">
      <option value="">-- Выберите изображение --</option>
      <!-- Здесь укажи реальные ссылки на изображения из твоего репозитория -->
      <option value="images/shoe1.jpg">Кроссовки 1</option>
      <option value="images/shoe2.jpg">Кроссовки 2</option>
      <option value="images/shirt1.jpg">Рубашка 1</option>
      <option value="images/shirt2.jpg">Рубашка 2</option>
    </select>
  </div>

  <div class="preview" id="previewImage" style="display:none;">
    <strong>Предпросмотр:</strong><br />
    <img src="" alt="Предпросмотр изображения" />
  </div>

  <button onclick="saveProduct()">Добавить в каталог</button>

  <script>
    const imageSelect = document.getElementById('imageSelect');
    const previewDiv = document.getElementById('previewImage');
    const previewImg = previewDiv.querySelector('img');

    // Замените baseURL на ссылку вашего репозитория GitHub Pages с завершающим "/"
    const baseURL = 'https://yourusername.github.io/your-repo-name/';

    imageSelect.addEventListener('change', () => {
      const val = imageSelect.value;
      if (val) {
        previewImg.src = baseURL + val;
        previewDiv.style.display = 'block';
      } else {
        previewImg.src = '';
        previewDiv.style.display = 'none';
      }
    });

    function saveProduct() {
      const title = document.getElementById('title').value.trim();
      const price = document.getElementById('price').value.trim();
      const size = document.getElementById('size').value.trim();
      const description = document.getElementById('description').value.trim();
      const imagePath = imageSelect.value;

      console.log('saveProduct called');
      console.log({title, price, size, description, imagePath});

      if (!title || !price || !size || !description || !imagePath) {
        alert('Пожалуйста, заполните все поля и выберите изображение!');
        return;
      }

      const product = {
        title,
        price,
        size,
        description,
        image: baseURL + imagePath
      };

      let products = [];
      try {
        products = JSON.parse(localStorage.getItem('products') || '[]');
      } catch (e) {
        console.error('Ошибка чтения localStorage:', e);
      }

      products.push(product);
      localStorage.setItem('products', JSON.stringify(products));
      console.log('Product saved:', product);

      // Переход в каталог
      window.location.href = 'catalog.html';
    }
  </script>

</body>
</html>
